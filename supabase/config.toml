# =====================================================================
# Supabase LOCAL development config
# https://supabase.com/docs/guides/local-development/cli/config
#
# ATENÇÃO: este arquivo configura APENAS o stack Supabase local (docker).
# Em produção (Supabase Cloud) a configuração é feita pelo painel web.
#
# Antes do deploy em produção, garantir no painel:
#   - Auth → Site URL = https://<dominio-vercel>
#   - Auth → Redirect URLs = inclui https://<dominio-vercel>/auth/callback
#   - Auth → Enable signup = FALSE (Coord cria usuários via service_role)
#   - Email templates traduzidos para PT-BR
# =====================================================================

project_id = "cfo-alunos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# DEV: signup aberto para facilitar criação de usuários de teste locais.
# Em produção manter FALSE no painel do Supabase Cloud.
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
